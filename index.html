<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Automation Core - All-in-One Dashboard</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --input-bg: #0d1117;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --danger-color: #da3633;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 28px;
            border: 1px solid var(--border-color);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 6px;
            color: var(--text-main);
            text-align: center;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #58a6ff;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.stop {
            background-color: var(--danger-color);
        }
        button.stop:hover {
            background-color: #b62324;
        }

        button:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .terminal {
            margin-top: 20px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            max-height: 220px;
            overflow-y: auto;
            display: none;
        }

        .terminal.active {
            display: block;
        }

        .log-line {
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .log-line.success {
            color: #3fb950;
        }

        .log-line.error {
            color: #f85149;
        }

        .log-line.highlight {
            color: #58a6ff;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Automation Core Dashboard</h1>
    <p class="subtitle">Painel unificado de gerenciamento e disparo local de sessões</p>

    <div class="form-group">
        <label for="platform">Plataforma Alvo</label>
        <select id="platform">
            <option value="instagram">Instagram (Growth Automation)</option>
            <option value="discord">Discord (Username Checker / Claimer)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="target">Identificador Alvo (@ Perfil ou Parâmetro)</label>
        <input type="text" id="target" placeholder="ex: seu.perfil ou prefixo">
    </div>

    <div class="form-group">
        <label for="threads">Volume / Threads de Execução</label>
        <input type="number" id="threads" min="1" max="1000" value="50">
    </div>

    <div class="btn-group">
        <button id="startBtn">Iniciar Sistema</button>
        <button id="stopBtn" class="stop" disabled>Parar Execução</button>
    </div>

    <div id="terminal" class="terminal">
        <div class="log-line">[SYS] Sistema pronto. Aguardando comandos...</div>
    </div>
</div>

<script>
    let active = false;

    function log(text, type = '') {
        const term = document.getElementById('terminal');
        const line = document.createElement('div');
        line.className = `log-line ${type}`;
        line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
        term.appendChild(line);
        term.scrollTop = term.scrollHeight;
    }

    document.getElementById('startBtn').addEventListener('click', async function() {
        const platform = document.getElementById('platform').value;
        const target = document.getElementById('target').value.trim();
        const threads = parseInt(document.getElementById('threads').value) || 10;
        const term = document.getElementById('terminal');

        if (!target) {
            alert('Por favor, informe o identificador alvo.');
            return;
        }

        term.innerHTML = '';
        term.classList.add('active');
        active = true;

        this.disabled = true;
        document.getElementById('stopBtn').disabled = false;

        log(`Iniciando motor para [${platform.toUpperCase()}] | Alvo: ${target}`, 'highlight');
        log('Carregando módulos de simulação assíncrona...', '');

        for (let i = 1; i <= threads; i++) {
            if (!active) break;
            
            await new Promise(r => setTimeout(r, 200));
            
            if (platform === 'instagram') {
                log(`[Bot #${i}] Conectando proxy residencial e injetando sessão em @${target}...`, '');
            } else {
                log(`[Worker #${i}] Verificando disponibilidade de handle na API...`, '');
            }

            if (i % 10 === 0) {
                log(`[CHECKPOINT] ${i} requisições processadas com sucesso.`, 'success');
            }
        }

        if (active) {
            log('[SUCCESS] Lote de tarefas executado por completo.', 'success');
        }

        active = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
    });

    document.getElementById('stopBtn').addEventListener('click', function() {
        active = false;
        this.disabled = true;
        document.getElementById('startBtn').disabled = false;
        log('[ABORT] Operação interrompida pelo operador.', 'error');
    });
</script>

</body>
</html>
