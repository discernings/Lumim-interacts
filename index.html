<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord 4-Digit Brute-Force Checker</title>
    <style>
        :root {
            --bg-color: #313338;
            --panel-bg: #2b2d31;
            --input-bg: #1e1f22;
            --accent-color: #5865f2;
            --accent-hover: #4752c4;
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
            --success-color: #23a55a;
            --success-bg: rgba(35, 165, 90, 0.1);
            --danger-color: #f23f43;
            --danger-bg: rgba(242, 63, 67, 0.1);
            --border-color: #1f2023;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 6px;
            color: var(--text-main);
            text-align: center;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="number"], input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .form-group {
            flex: 1;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 6px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.stop {
            background-color: var(--danger-color);
        }
        button.stop:hover {
            background-color: #d83c3e;
        }

        button:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }

        .results-container {
            margin-top: 20px;
            max-height: 250px;
            overflow-y: auto;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            display: none;
        }

        .results-container.active {
            display: block;
        }

        .log-line {
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 4px;
        }

        .log-line.available {
            color: var(--success-color);
            font-weight: bold;
            background: var(--success-bg);
            padding: 6px;
            border-radius: 4px;
        }

        .log-line.taken {
            color: var(--text-muted);
        }

        .log-line.error {
            color: var(--danger-color);
        }

        .action-btn {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Discord 4-Digit Loop Checker</h1>
    <p class="subtitle">Varredura automática e contínua de combinações numéricas de 4 dígitos (0000 a 9999) até encontrar uma livre.</p>

    <div class="form-group">
        <label for="token">Discord User Token (Authorization)</label>
        <input type="password" id="token" placeholder="Cole seu token de usuário aqui">
    </div>

    <div class="form-group">
        <label for="prefix">Prefixo Opcional (Ex: x, vibe, _) -> Total ficará com 4 dígitos + prefixo ou fixo 4 dígitos</label>
        <input type="text" id="prefix" placeholder="Deixe em branco para testar apenas 4 dígitos numéricos (0000 - 9999)">
    </div>

    <div class="row">
        <div class="form-group">
            <label for="startFrom">Iniciar a partir de (Número)</label>
            <input type="number" id="startFrom" min="0" max="9999" value="0">
        </div>
        <div class="form-group">
            <label for="delay">Delay entre requisições (ms)</label>
            <input type="number" id="delay" min="300" max="5000" value="800">
        </div>
    </div>

    <div class="btn-group">
        <button id="startBtn">Iniciar Loop Infinito</button>
        <button id="stopBtn" class="stop" disabled>Parar Loop</button>
    </div>

    <div id="results" class="results-container"></div>
</div>

<script>
    let isRunning = false;

    function addLog(text, type = 'taken', username = '') {
        const box = document.getElementById('results');
        const line = document.createElement('div');
        line.className = `log-line ${type}`;
        
        let content = `<span>[${new Date().toLocaleTimeString()}] ${text}</span>`;
        if (type === 'available') {
            content += `<button class="action-btn" onclick="navigator.clipboard.writeText('${username}'); alert('Copiado: @${username}');">Copiar</button>`;
        }
        
        line.innerHTML = content;
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
    }

    document.getElementById('startBtn').addEventListener('click', async function() {
        const token = document.getElementById('token').value.trim();
        const prefix = document.getElementById('prefix').value.toLowerCase().trim();
        let currentNum = parseInt(document.getElementById('startFrom').value) || 0;
        const delay = parseInt(document.getElementById('delay').value) || 800;
        const resultsContainer = document.getElementById('results');

        if (!token) {
            alert('Insira o seu token do Discord.');
            return;
        }

        resultsContainer.innerHTML = '';
        resultsContainer.classList.add('active');
        
        isRunning = true;
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;

        addLog('Iniciando loop de verificação de 4 dígitos...', 'taken');

        while (isRunning && currentNum <= 9999) {
            // Formata o número para ter sempre 4 dígitos (ex: 0 -> 0000, 42 -> 0042)
            const numPadded = String(currentNum).padStart(4, '0');
            const username = prefix + numPadded;

            if (username.length > 32 || username.length < 2) {
                currentNum++;
                continue;
            }

            try {
                const response = await fetch(`https://discord.com/api/v9/users/@me/pomelo-attempt`, {
                    method: 'POST',
                    headers: {
                        'Authorization': token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username: username })
                });

                if (response.status === 200) {
                    const data = await response.json();
                    if (data.taken === false) {
                        addLog(`[ENCONTRADO LIVRE!] @${username}`, 'available', username);
                        alert(`Username disponível encontrado e travado no log: @${username}!`);
                        break; // Para o loop ao achar o primeiro disponível
                    } else {
                        addLog(`[Ocupado] @${username}`, 'taken');
                    }
                } else if (response.status === 429) {
                    addLog(`Rate limit atingido. Pausando por 5 segundos...`, 'error');
                    await new Promise(r => setTimeout(r, 5000));
                    continue; // Repete a tentativa atual
                } else if (response.status === 401) {
                    addLog(`Erro 401: Token inválido ou expirado.`, 'error');
                    break;
                } else {
                    addLog(`Erro HTTP ${response.status} em @${username}`, 'error');
                }
            } catch (err) {
                addLog(`Erro de conexão ao testar @${username}`, 'error');
            }

            currentNum++;
            await new Promise(r => setTimeout(r, delay));
        }

        isRunning = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        addLog('Loop finalizado ou interrompido.', 'taken');
    });

    document.getElementById('stopBtn').addEventListener('click', function() {
        isRunning = false;
        this.disabled = true;
        document.getElementById('startBtn').disabled = false;
        addLog('Sinal de parada enviado pelo usuário.', 'error');
    });
</script>

</body>
</html>
