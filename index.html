<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaBoost Panel - Growth Engine</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --input-bg: #0f172a;
            --accent-color: #ec4899;
            --accent-hover: #db2777;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            text-align: center;
            background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #f58529, #dd2a7b);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background: var(--border-color);
            cursor: not-allowed;
        }

        .status-box {
            margin-top: 20px;
            padding: 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: none;
        }

        .status-box.active {
            display: block;
        }

        .log-line {
            margin-bottom: 6px;
        }

        .log-line.success {
            color: var(--success-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>InstaBoost Panel</h1>
    <p class="subtitle">Sistema automatizado de injeção de engajamento e seguidores</p>

    <div class="form-group">
        <label for="username">@ Username do Instagram</label>
        <input type="text" id="username" placeholder="seu.perfil">
    </div>

    <div class="form-group">
        <label for="amount">Quantidade de Seguidores</label>
        <select id="amount">
            <option value="500">500 Seguidores</option>
            <option value="1000" selected>1.000 Seguidores</option>
            <option value="5000">5.000 Seguidores</option>
            <option value="10000">10.000 Seguidores</option>
        </select>
    </div>

    <button id="startBtn">Iniciar Processo de Entrega</button>

    <div id="statusBox" class="status-box">
        <div id="logContent">Iniciando conexão com os servidores proxy...</div>
    </div>
</div>

<script>
    document.getElementById('startBtn').addEventListener('click', async function() {
        const username = document.getElementById('username').value.trim();
        const amount = document.getElementById('amount').value;
        const statusBox = document.getElementById('statusBox');
        const logContent = document.getElementById('logContent');

        if (!username) {
            alert('Insira o nome de usuário do Instagram.');
            return;
        }

        this.disabled = true;
        statusBox.classList.add('active');
        logContent.innerHTML = `<div class="log-line">[+] Conectando ao alvo: @${username}</div>`;

        const steps = [
            `[+] Estabelecendo túnel seguro com a API do Instagram...`,
            `[+] Ativando cluster de bots distribuídos (Node pool ativo)...`,
            `[+] Ignorando limites de taxa (Rate Limit Bypass)...`,
            `[+] Injetando lote inicial de seguidores para @${username}...`,
            `[+] Processando verificação de segurança automatizada...`,
            `[SUCCESS] Entrega concluída com sucesso! Os seguidores serão contabilizados no perfil em instantes.`
        ];

        for (let i = 0; i < steps.length; i++) {
            await new Promise(r => setTimeout(r, 1200));
            const isLast = i === steps.length - 1;
            logContent.innerHTML += `<div class="log-line ${isLast ? 'success' : ''}">${steps[i]}</div>`;
            statusBox.scrollTop = statusBox.scrollHeight;
        }

        this.disabled = false;
    });
</script>

</body>
</html>
